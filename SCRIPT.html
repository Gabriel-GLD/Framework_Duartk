    //====SCRIPT PARA O CHECKBOX DE GERENCIAR CONTEÚDO====


        /* COMPONENTE GLOBAL */
        /* CHECKBOX + ABAS DINÂMICAS */

        document.addEventListener('DOMContentLoaded', () => {

          /* TODOS OS CHECKBOXES */
          document
            .querySelectorAll('[data-toggle]')
            .forEach(checkbox => {

              checkbox.addEventListener('change', function () {

                const nome = this.dataset.toggle;

                /* CARD/CONTAINER PAI */
                const card =
                  this.closest('.card');

                /* ÁREA DAS ABAS */
                const tabsArea =
                  card.querySelector('.toggle-tabs');

                /* CONTEÚDO */
                const conteudo =
                  card.querySelector(
                    `[data-content="${nome}"]`
                  );

                if (!conteudo) return;





                /* MARCOU */

                if (this.checked) {

                  /* cria aba se não existir */
                  if (
                    !card.querySelector(
                      `[data-tab="${nome}"]`
                    )
                  ) {

                    const tab =
                      document.createElement('button');

                    tab.className = 'toggle-tab';

                    tab.dataset.tab = nome;

                    tab.innerText =
                      this.parentElement.innerText.trim();





                    /* INSERE A ABA NA ORDEM DOS CHECKBOXES */

                    const todosCheckboxes = [
                      ...card.querySelectorAll('[data-toggle]')
                    ];

                    /* índice do checkbox atual */
                    const indiceAtual =
                      todosCheckboxes.indexOf(this);

                    /* abas existentes */
                    const abasExistentes = [
                      ...tabsArea.querySelectorAll('.toggle-tab')
                    ];

                    let inserido = false;

                    /* percorre abas existentes */
                    abasExistentes.forEach(abaExistente => {

                      const checkboxExistente =
                        card.querySelector(
                          `[data-toggle="${abaExistente.dataset.tab}"]`
                        );

                      const indiceExistente =
                        todosCheckboxes.indexOf(
                          checkboxExistente
                        );

                      /* insere antes */
                      if (
                        indiceAtual < indiceExistente &&
                        !inserido
                      ) {

                        tabsArea.insertBefore(
                          tab,
                          abaExistente
                        );

                        inserido = true;

                      }

                    });

                    /* se não inseriu */
                    if (!inserido) {

                      tabsArea.appendChild(tab);

                    }

                  }

                  ativarConteudo(card, nome);

                }


                /* DESMARCOU */

                else {

                  /* remove aba */
                  const tab =
                    card.querySelector(
                      `[data-tab="${nome}"]`
                    );

                  if (tab) tab.remove();

                  /* remove conteúdo */
                  conteudo.classList.remove('active');

                  /* ativa primeira aba restante */
                  const primeiraAba =
                    card.querySelector('.toggle-tab');

                  if (primeiraAba) {

                    ativarConteudo(
                      card,
                      primeiraAba.dataset.tab
                    );

                  }

                }

              });

            });


          /* CLIQUE NAS ABAS */

          document.addEventListener('click', function (e) {

            if (
              !e.target.classList.contains('toggle-tab')
            ) return;

            const card =
              e.target.closest('.card');

            ativarConteudo(
              card,
              e.target.dataset.tab
            );

          });

        });

        /* FUNÇÃO GLOBAL */

        function ativarConteudo(card, nome) {

          /* remove ativos */
          card
            .querySelectorAll('.toggle-tab')
            .forEach(tab => {

              tab.classList.remove('active');

            });

          card
            .querySelectorAll('.toggle-content')
            .forEach(content => {

              content.classList.remove('active');

            });

          /* ativa aba */
          const tab =
            card.querySelector(
              `[data-tab="${nome}"]`
            );

          if (tab) {

            tab.classList.add('active');

          }

          /* ativa conteúdo */
          const conteudo =
            card.querySelector(
              `[data-content="${nome}"]`
            );

          if (conteudo) {

            conteudo.classList.add('active');

          }

        }




      // GERENCIADOR DE CONTEUDO APENAS COM ABAS

        
        document.addEventListener('click', function(e) {

          const aba = e.target.closest('[data-fixed-tab]');

          if (!aba) return;

          const nome = aba.dataset.fixedTab;

          const container =
            aba.closest('.card');

          container
            .querySelectorAll('.fixed-content')
            .forEach(tab => {

              tab.classList.remove('active');

            });

          container
            .querySelectorAll('[data-fixed-content]')
            .forEach(content => {

              content.classList.remove('active');

            });

          aba.classList.add('active');

          const conteudo =
            container.querySelector(
              `[data-fixed-content="${nome}"]`
            );

          if (conteudo) {

            conteudo.classList.add('active');

          }

        });

      document.addEventListener('click', (e) => {

        const closeBtn =

        if (closeBtn) {

          const modal =

      document.querySelectorAll('.modal')

          modal.addEventListener('click', (e) => {

              return;
            }

            if (e.target === modal) {

              fecharModal(modal);

            }

          });

        });





      /* ESC */

      document.addEventListener('keydown', (e) => {

        if (e.key !== 'Escape') return;


        const modalAberto =
          document.querySelector('.modal.active');

        if (modal.classList.contains('loading')){
              return;
        }

        if (e.target === modal) {

          fecharModal(modalAberto);
        }


      });

    });


    /* FUNÇÃO GLOBAL */

    function fecharModal(modal) {

      if (!modal) return;

      modal.classList.remove('active');

      /* verifica se ainda existe modal aberto */
      const aindaExiste =
        document.querySelector('.modal.active');

      if (!aindaExiste) {

        document.body.style.overflow = '';

      }

    }


    // Faz ele sempre começar do inicio quando é iniciado

    function subirModal(modal) {

      if (!modal) return;

      /* modal externo */
      modal.scrollTop = 0;

      /* qualquer área rolável dentro dele */
      modal
        .querySelectorAll('*')
        .forEach(elemento => {

          const estilo =
            getComputedStyle(elemento);

          const possuiScroll =
            estilo.overflowY === 'auto' ||
            estilo.overflowY === 'scroll';

          if (possuiScroll) {

            elemento.scrollTop = 0;

          }

        });

    }

    // =====SCRIPT PARA MODAIS ABRIR DE OUTRAS MANEIRAS====

  
    function abrirModal(modalOuId) {

      const modal =
        typeof modalOuId === "string"
          ? document.getElementById(modalOuId)
          :modalOuId

      
      if(!modal) return;

      modal.classList.add("active");
      
      subirModal(modal);

      document.body.style.overflow = "hidden";


    }


    // FECHAMENTO DOS MODAIS GLOBAIS


    function fecharModal(modalOuId) {

      const modal = 
        typeof modalOuId === "string"
          ? document.getElementById(modalOuId)
          :modalOuId

      if(!modal) return;

      modal.classList.remove("active");

      modal.dispatchEvent(
        new CustomEvent("modal:close")
      );


      // verifica se existe algum modal aberto

      if (!document.querySelector(".modal.active")) {

        document.body.style.overflow = "";
        
      }
    }











    
  // SCROLL BODY
  // Conteúdos, vídeos, imagens etc.

  (function () {

    "use strict";


    // PEGA OS CONTEÚDOS

    function obterConteudos(scroll) {

      if (!scroll) return [];

      return Array.from(
        scroll.children
      ).filter(elemento =>
        elemento.hasAttribute("data-scroll-content")
      );

    }


    // MOSTRA SOMENTE UM CONTEÚDO

    function mostrarConteudo(
      conteudos,
      indice
    ) {

      conteudos.forEach(
        (conteudo, i) => {

          conteudo.hidden =
            i !== indice;

        }
      );

    }


    // ATUALIZA OS BOTÕES

    function atualizarBotoesScroll(
      scroll,
      conteudos,
      atual
    ) {

      if (!scroll) return;


      const anterior =
        scroll.querySelector(
          "[data-scroll-prev]"
        );


      const proximo =
        scroll.querySelector(
          "[data-scroll-next]"
        );


      // ANTERIOR

      if (anterior) {

        anterior.disabled =
          atual <= 0;

      }


      // PRÓXIMO

      if (proximo) {

        proximo.disabled =
          atual >= conteudos.length - 1;

      }

    }


    // INICIALIZA UM SCROLL-BODY

    function iniciarScrollBody(scroll) {

      if (!scroll) return;


      const conteudos =
        obterConteudos(scroll);


      if (!conteudos.length) return;


      // Começa no primeiro

      mostrarConteudo(
        conteudos,
        0
      );


      // Marca como inicializado

      scroll.dataset.scrollInitialized =
        "true";


      // Atualiza botões

      atualizarBotoesScroll(
        scroll,
        conteudos,
        0
      );

    }


    // CLIQUE NOS BOTÕES

    document.addEventListener(
      "click",
      function (e) {


        const botao =
          e.target.closest(
            "[data-scroll-prev], [data-scroll-next]"
          );


        if (!botao) return;


        const scroll =
          botao.closest(
            ".scroll-body"
          );


        if (!scroll) return;


        const conteudos =
          obterConteudos(scroll);


        if (!conteudos.length) return;


        // Garante inicialização

        if (
          scroll.dataset.scrollInitialized !==
          "true"
        ) {

          iniciarScrollBody(scroll);

        }


        // Descobre qual está visível

        let atual =
          conteudos.findIndex(
            conteudo =>
              !conteudo.hidden
          );


        // Segurança

        if (atual === -1) {

          atual = 0;

        }


        // PRÓXIMO

        if (
          botao.matches(
            "[data-scroll-next]"
          )
        ) {

          if (
            atual <
            conteudos.length - 1
          ) {

            atual++;

          }

        }


        // ANTERIOR

        if (
          botao.matches(
            "[data-scroll-prev]"
          )
        ) {

          if (atual > 0) {

            atual--;

          }

        }


        // Mostra somente o atual

        mostrarConteudo(
          conteudos,
          atual
        );


        // Atualiza botões

        atualizarBotoesScroll(
          scroll,
          conteudos,
          atual
        );

      }
    );


    // INICIALIZA TODOS

    function inicializarScrollBodies() {

      document
        .querySelectorAll(
          ".scroll-body"
        )
        .forEach(
          iniciarScrollBody
        );

    }


    // OBSERVA NOVOS ELEMENTOS
    // Útil para interfaces do Apps Script

    const observer =
      new MutationObserver(
        function (mutacoes) {

          mutacoes.forEach(
            function (mutacao) {

              mutacao.addedNodes.forEach(
                function (node) {

                  if (
                    node.nodeType !== 1
                  ) {

                    return;

                  }


                  // Se for um scroll-body

                  if (
                    node.matches &&
                    node.matches(
                      ".scroll-body"
                    )
                  ) {

                    iniciarScrollBody(node);

                  }


                  // Se tiver scroll-body dentro

                  if (
                    node.querySelectorAll
                  ) {

                    node
                      .querySelectorAll(
                        ".scroll-body"
                      )
                      .forEach(
                        iniciarScrollBody
                      );

                  }

                }
              );

            }
          );

        }
      );


    // Observa o documento

    if (document.body) {

      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true
        }
      );

    }


    // INICIALIZAÇÃO

    function inicializar() {

      inicializarScrollBodies();

    }


    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        inicializar
      );

    } else {

      inicializar();

    }


  })();
